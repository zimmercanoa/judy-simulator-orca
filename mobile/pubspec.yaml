name: judy_simulator
description: "JuDy Simulator - capacitación VR en seguridad fotovoltaica (NOM-009 / NOM-029)"
publish_to: 'none'

# Mantener sincronizado con AppConfig.appVersion / appVersionCode
# y con el tag git mobile-vX.Y.Z (lo verifica test/version_test.dart).
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
